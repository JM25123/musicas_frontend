<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar música - Minhas Músicas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cadastrar.css">
</head>
<body>
    <main>
        <a href="index.html">Voltar para a lista</a>

        <h1>Cadastrar música</h1>

        <label for="titulo">Título</label>
        <input type="text" id="titulo">

        <label for="artista">Artista</label>
        <input type="text" id="artista">

        <label for="genero">Gênero</label>
        <input type="text" id="genero">

        <label for="ano">Ano</label>
        <input type="number" id="ano">

        <label for="duracao">Duração em minutos</label>
        <input type="number" id="duracao">

        <button id="botaoCadastrar">Cadastrar</button>
    </main>

    <script src="cadastrar.js"></script>
</body>
</html>
